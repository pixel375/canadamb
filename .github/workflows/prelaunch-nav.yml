name: Prelaunch desktop navigation hotfix browser QA

on:
  push:
    branches:
      - implementation/network-foundation
  pull_request:
    paths:
      - 'resources/**'
      - 'tests/Browser/**'
      - '.github/workflows/prelaunch-nav.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANADAMB_COMMERCIAL_PLANNING_RECORDS: 'true'
      CANADAMB_PROPERTY_DRAFTS_ENABLED: 'true'
      CANADAMB_REAL_ESTATE_PUBLIC_LISTINGS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, mbstring, openssl, pdo_sqlite, sodium, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Build isolated local test site and install Chromium
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npm run build
          npm install --no-save --package-lock=false playwright@1.56.1
          # Retry transient runner package-index/download failures, never skip QA.
          installed=0
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -qq && npx playwright install --with-deps chromium; then
              installed=1
              break
            fi
            echo "Chromium setup attempt $attempt failed"
            sleep 5
          done
          test "$installed" = 1
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force
          php artisan migrate --path=database/proposed-migrations --force
          git rev-parse HEAD > public/build/source-commit
      - name: Start disposable server
        run: |
          php artisan serve --host=0.0.0.0 --port=8000 > navigation-server.log 2>&1 &
          echo $! > navigation-server.pid
          for i in $(seq 1 40); do
            if curl -fsS -H 'Host: canadamb.localhost' http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat navigation-server.log
          tail -n 100 storage/logs/laravel.log 2>/dev/null || true
          exit 1
      - name: Verify desktop menus and tablet drawer in Chromium
        run: node tests/Browser/prelaunch-navigation.cjs
      - name: Seed only the disposable QA notification account
        run: php tests/Browser/seed-notification-fixtures.php
      - name: Verify authenticated notifications in Chromium
        run: node tests/Browser/prelaunch-authenticated-notifications.cjs
      - name: Exercise staged features in disposable browser QA
        env:
          APP_URL: http://canadamb.localhost:8001
          CANADAMB_JOB_SEARCHES: 'true'
          CANADAMB_MARKETPLACE_SEARCHES: 'true'
          CANADAMB_EXTENDED_MESSAGING: 'true'
          CANADAMB_MESSAGE_ATTACHMENTS: 'true'
          CANADAMB_BUSINESS_ACCESS_REQUESTS: 'true'
          CANADAMB_BUSINESS_DISPUTES: 'true'
          CANADAMB_BUSINESS_CHANGES: 'true'
          CANADAMB_BUSINESS_INQUIRY_CONTROLS: 'true'
          CANADAMB_PRIVACY_REQUESTS: 'true'
          CANADAMB_NOTIFICATION_PREFERENCES: 'true'
          CANADAMB_RECURRING_EVENTS: 'true'
          CANADAMB_EVENT_DISCUSSIONS: 'true'
          CANADAMB_CONTENT_REPORTS: 'true'
          CANADAMB_NEWS_CANDIDATE_REVIEW: 'true'
        run: |
          php artisan serve --host=127.0.0.1 --port=8001 --no-reload > staged-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS -H 'Host: canadamb.localhost' http://127.0.0.1:8001/ >/dev/null; then
              node tests/Browser/prelaunch-staged-features.cjs
              exit $?
            fi
            sleep 1
          done
          cat staged-server.log
          exit 1
      - name: Preserve screenshots and local logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-menu-${{ github.sha }}
          path: |
            test-results/
            navigation-server.log
            staged-server.log
            storage/logs/laravel.log
          if-no-files-found: ignore
      - name: Stop disposable server
        if: always()
        run: |
          if [ -f navigation-server.pid ]; then kill "$(cat navigation-server.pid)" || true; fi
