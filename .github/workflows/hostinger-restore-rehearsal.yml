name: CanadaMB one-time production backup restore rehearsal

on:
  push:
    branches: [main]
    paths: ['.github/workflows/hostinger-restore-rehearsal.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    environment: hostinger-prelaunch
    env:
      SSH_HOST: ${{ vars.HOSTINGER_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_PORT }}
      SSH_USER: ${{ vars.HOSTINGER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
      TARGET_SHA: 44448bd0de1b736a51909f6ec87f692a41d57950
    steps:
      - name: Back up actual database privately and restore only into a disposable isolated runner database
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ && "$SSH_USER" =~ ^[A-Za-z0-9_-]+$ &&
             "$SSH_PORT" =~ ^[0-9]{1,5}$ && -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || exit 1
          umask 077
          dir=$(mktemp -d)
          container="canadamb-restorerehearsal-$GITHUB_RUN_ID"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf -- "$dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$dir/known_hosts"
          chmod 600 "$dir/key" "$dir/known_hosts"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null
          SSH=(ssh -T -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$dir/known_hosts" -o IdentitiesOnly=yes -i "$dir/key" -p "$SSH_PORT")
          scp_opts=(-B -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$dir/known_hosts" -o IdentitiesOnly=yes -i "$dir/key" -P "$SSH_PORT")

          "${SSH[@]}" "$SSH_USER@$SSH_HOST" bash -se -- "$GITHUB_RUN_ID" "$TARGET_SHA" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          run_id=$1; commit=$2
          [[ "$run_id" =~ ^[0-9]+$ && "$commit" =~ ^[0-9a-f]{40}$ ]] || exit 1
          site="$HOME/domains/canadamb.ca"
          app="$site/canadamb-app"
          source="$app/source"
          old=$(readlink -e "$app/current")
          [[ "$old" == "$app/releases/"* && -s "$old/artisan" ]] || exit 1
          [[ ! -e "$old/storage/framework/down" && ! -e "$app/update.pause" ]] || exit 1
          git -C "$source" fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git -C "$source" cat-file -e "$commit:deploy/hostinger-backup.php"
          git -C "$source" merge-base --is-ancestor "$commit" refs/remotes/origin/main
          scratch="$site/.builds/restore-rehearsal-$run_id"
          backups="$app/shared/backups/restore-rehearsal-$run_id"
          [[ ! -e "$scratch" && ! -e "$backups" && ! -L "$scratch" && ! -L "$backups" ]] || exit 1
          install -d -m 700 "$scratch" "$backups"
          git -C "$source" show "$commit:deploy/hostinger-backup.php" > "$scratch/backup.php"
          [[ "$(git -C "$source" hash-object "$scratch/backup.php")" == "$(git -C "$source" rev-parse "$commit:deploy/hostinger-backup.php")" ]] || exit 1
          /usr/bin/php "$scratch/backup.php" "$old" "$backups/u713153343_canadamb.sql" u713153343_canadamb
          test -s "$backups/u713153343_canadamb.sql"
          sha256sum "$backups/u713153343_canadamb.sql" > "$backups/checksums.sha256"
          chmod 600 "$backups/"*
          rm -f "$scratch/backup.php"
          rmdir "$scratch"
          echo "Private production SQL backup completed successfully."
          REMOTE

          scp "${scp_opts[@]}" \
            "$SSH_USER@$SSH_HOST:domains/canadamb.ca/canadamb-app/shared/backups/restore-rehearsal-$GITHUB_RUN_ID/u713153343_canadamb.sql" \
            "$dir/database.sql"
          chmod 600 "$dir/database.sql"
          [[ -s "$dir/database.sql" ]] || exit 1
          expected=$("${SSH[@]}" "$SSH_USER@$SSH_HOST" \
            "sha256sum ~/domains/canadamb.ca/canadamb-app/shared/backups/restore-rehearsal-$GITHUB_RUN_ID/u713153343_canadamb.sql" | awk '{print $1}')
          actual=$(sha256sum "$dir/database.sql" | awk '{print $1}')
          [[ "$expected" == "$actual" ]] || { echo "::error::Backup checksum mismatch"; exit 1; }
          echo "Remote backup matches local checksum. Restoring exclusively to a disposable MariaDB container."

          password=$(openssl rand -hex 20)
          docker run -d --rm --name "$container" \
            -e MARIADB_ROOT_PASSWORD="$password" -e MARIADB_DATABASE=canadamb_restore \
            mariadb:11.8 >/dev/null
          for attempt in {1..40}; do
            if docker exec -e MYSQL_PWD="$password" "$container" mariadb -u root -N -e 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec -e MYSQL_PWD="$password" "$container" mariadb -u root -N -e 'SELECT 1' >/dev/null
          if ! docker exec -i -e MYSQL_PWD="$password" "$container" mariadb -u root canadamb_restore < "$dir/database.sql" 2>"$dir/restore-errors"; then
            echo "::error::Actual production dump failed to restore in the isolated MariaDB container."
            exit 1
          fi
          tables=$(docker exec -e MYSQL_PWD="$password" "$container" mariadb -u root -N canadamb_restore -e 'SHOW TABLES' | wc -l)
          accounts=$(docker exec -e MYSQL_PWD="$password" "$container" mariadb -u root -N canadamb_restore -e 'SELECT COUNT(*) FROM users')
          listings=$(docker exec -e MYSQL_PWD="$password" "$container" mariadb -u root -N canadamb_restore -e 'SELECT COUNT(*) FROM listings')
          domains=$(docker exec -e MYSQL_PWD="$password" "$container" mariadb -u root -N canadamb_restore -e 'SELECT COUNT(*) FROM domains WHERE host IN ("canadamb.ca","brandonmb.ca")')
          [[ "$tables" -gt 10 && "$accounts" -ge 1 && "$domains" -eq 2 ]] || {
            echo "::error::Restored schema failed minimum data-integrity checks."
            exit 1
          }
          echo "ACTUAL PRODUCTION BACKUP RESTORE PASSED: tables=$tables; account_count=$accounts; listing_count=$listings; verified_network_hosts=$domains"
          echo "The temporary runner copy and MariaDB container will be destroyed; the private backup remains on Hostinger."
