name: Install safe hPanel cron wrapper (private only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hostinger-cron-install.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: hostinger-prelaunch
    env:
      SSH_HOST: ${{ vars.HOSTINGER_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_PORT }}
      SSH_USER: ${{ vars.HOSTINGER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - name: Install verified stable cron wrapper privately, without scheduling it
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ && "$SSH_PORT" =~ ^[0-9]{1,5}$ &&
             "$SSH_USER" =~ ^[A-Za-z0-9_-]+$ && -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || exit 1
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf -- "$dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$dir/hosts"
          chmod 600 "$dir/key" "$dir/hosts"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null
          ssh -T -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$dir/hosts" -o IdentitiesOnly=yes -i "$dir/key" -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" bash -se -- '44448bd0de1b736a51909f6ec87f692a41d57950' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          sha=$1
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          site="$HOME/domains/canadamb.ca"
          app="$site/canadamb-app"
          current=$(readlink -e "$app/current")
          [[ "$current" == "$app/releases/"* && -s "$current/artisan" && ! -e "$app/update.pause" ]] || exit 1
          [[ ! -L "$app/hostinger-cron.sh" && -d "$app/source/.git" ]] || exit 1
          git -C "$app/source" fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git -C "$app/source" cat-file -e "$sha:deploy/hostinger-cron.sh"
          git -C "$app/source" merge-base --is-ancestor "$sha" refs/remotes/origin/main
          tmp=$(mktemp "$app/.hostinger-cron.XXXXXXXX")
          trap 'rm -f "$tmp"' EXIT
          git -C "$app/source" show "$sha:deploy/hostinger-cron.sh" > "$tmp"
          test -s "$tmp"
          test "$(git -C "$app/source" hash-object "$tmp")" = "$(git -C "$app/source" rev-parse "$sha:deploy/hostinger-cron.sh")"
          grep -Fq 'update.pause' "$tmp"
          grep -Fq 'scheduler.log' "$tmp"
          bash -n "$tmp"
          chmod 700 "$tmp"
          mv -f "$tmp" "$app/hostinger-cron.sh"
          echo 'CRON WRAPPER INSTALLED (no schedule changed)'
          echo 'Hostinger hPanel custom cron command:'
          printf '/usr/bin/bash %s/hostinger-cron.sh %s /usr/bin/php\n' "$app" "$site"
          REMOTE
