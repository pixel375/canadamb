name: CanadaMB live scheduler queue smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canadamb-live-scheduler-queue-smoke
  cancel-in-progress: false

jobs:
  queue-smoke:
    name: Enqueue harmless job and await hPanel scheduler (no manual queue worker)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: hostinger-prelaunch
    env:
      SSH_HOST: ${{ vars.HOSTINGER_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_PORT }}
      SSH_USER: ${{ vars.HOSTINGER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - name: Verify automatic scheduler drains database queue without exposing user data
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ && "$SSH_USER" =~ ^[A-Za-z0-9_-]+$ &&
             "$SSH_PORT" =~ ^[0-9]{1,5}$ && -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || exit 1
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf -- "$dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$dir/hosts"
          chmod 600 "$dir/key" "$dir/hosts"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null
          ssh -T -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$dir/hosts" -o IdentitiesOnly=yes \
            -i "$dir/key" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            bash -se -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          run_id=$1
          [[ "$run_id" =~ ^[0-9]+$ ]] || exit 2
          site="$HOME/domains/canadamb.ca"
          app="$site/canadamb-app"
          current=$(readlink -e "$app/current")
          [[ "$current" == "$app/releases/"* && -s "$current/artisan" &&
             -s "$current/vendor/autoload.php" && ! -e "$app/update.pause" &&
             ! -e "$current/storage/framework/down" ]] || exit 1
          [[ -s "$app/hostinger-cron.sh" ]] || exit 1
          logs="$app/shared/storage/logs"
          [[ -d "$logs" && ! -L "$logs" ]] || exit 1
          marker="$logs/cron-queue-probe-$run_id.ok"
          scratch="$site/.builds/queue-smoke-$run_id"
          [[ ! -e "$scratch" && ! -e "$marker" ]] || exit 1
          install -d -m 700 "$scratch"
          cleanup() {
            rm -f "$scratch/dispatch.php"
            rmdir "$scratch" 2>/dev/null || true
          }
          trap cleanup EXIT

          cat > "$scratch/dispatch.php" <<'PHP'
          <?php
          declare(strict_types=1);

          use Illuminate\Contracts\Console\Kernel;
          use Illuminate\Queue\CallQueuedClosure;
          use Illuminate\Support\Facades\DB;
          use Illuminate\Support\Facades\Queue;

          [$self, $release, $id] = $argv;
          if (! preg_match('/^[0-9]+$/D', $id)) {
              throw new RuntimeException('Invalid probe identifier');
          }
          require $release.'/vendor/autoload.php';
          $app = require $release.'/bootstrap/app.php';
          $app->make(Kernel::class)->bootstrap();

          if (config('queue.default') !== 'database'
              || ! config('network.cron_queue_drain')
              || ! config('network.prelaunch')
              || config('network.news_polling')) {
              throw new RuntimeException('Prelaunch scheduler safety configuration mismatch');
          }

          $before = DB::table('failed_jobs')->count();
          $job = CallQueuedClosure::create(static function () use ($id): void {
              $marker = storage_path('logs/cron-queue-probe-'.$id.'.ok');
              if (file_put_contents($marker, 'processed', LOCK_EX) !== strlen('processed')) {
                  throw new RuntimeException('Queue probe marker could not be written');
              }
          });
          $queued = Queue::connection('database')->push($job);
          if ($queued === null || $queued === false) {
              throw new RuntimeException('Could not enqueue probe');
          }
          echo 'CONTROLLED_QUEUE_CANARY_ENQUEUED'.PHP_EOL;
          echo 'Failed job count at enqueue: '.$before.PHP_EOL;
          PHP

          chmod 600 "$scratch/dispatch.php"
          /usr/bin/php -l "$scratch/dispatch.php" >/dev/null
          /usr/bin/php "$scratch/dispatch.php" "$current" "$run_id"

          # Do NOT invoke schedule:run or queue:work here. Let hPanel's real
          # every-minute invocation consume the database queue.
          done=0
          for attempt in {1..42}; do
            if [[ -f "$marker" && ! -L "$marker" ]] && grep -qx processed "$marker"; then
              done=1
              break
            fi
            sleep 5
          done
          if [[ "$done" != 1 ]]; then
            echo 'QUEUE_CANARY_NOT_PROCESSED_WITHIN_210_SECONDS'
            if [[ -f "$logs/scheduler.log" ]]; then
              age=$(($(date +%s)-$(stat -c '%Y' "$logs/scheduler.log")))
              echo "Scheduler log age in seconds: $age"
            fi
            # Keep the test failure safe: the queued job can still complete later.
            exit 1
          fi

          rm -f "$marker"
          echo 'LIVE CRON QUEUE SMOKE PASSED: hPanel scheduler processed queued job automatically'
          /usr/bin/php "$current/artisan" queue:failed --no-ansi | sed -n '1,3p' | cut -c 1-120
          REMOTE
