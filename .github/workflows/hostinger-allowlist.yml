name: CanadaMB private prelaunch IP update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hostinger-allowlist.yml']
  workflow_dispatch:
    inputs:
      ip:
        description: 'New public IP to allow (preserve existing)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: canadamb-hostinger-allowlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hostinger-prelaunch
    env:
      TARGET_IP: ${{ inputs.ip || '23.175.128.206' }}
      SSH_HOST: ${{ vars.HOSTINGER_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_PORT }}
      SSH_USER: ${{ vars.HOSTINGER_USER }}
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_HOST_KEYS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - name: Append IP with private backup, rebuild cached config and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ && "$SSH_USER" =~ ^[A-Za-z0-9_-]+$ && "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          (( SSH_PORT > 0 && SSH_PORT < 65536 )) || exit 1
          [[ -n "$SSH_KEY" && -n "$SSH_HOST_KEYS" ]] || exit 1
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf -- "$dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$dir/key"
          printf '%s\n' "$SSH_HOST_KEYS" > "$dir/hosts"
          chmod 600 "$dir/key" "$dir/hosts"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null
          ssh -T -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$dir/hosts" -o IdentitiesOnly=yes \
            -i "$dir/key" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -se -- "$TARGET_IP" "$GITHUB_RUN_ID" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ip=$1
          run_id=$2
          [[ "$run_id" =~ ^[0-9]+$ ]] || exit 1
          php=/usr/bin/php
          "$php" -r 'exit(filter_var($argv[1], FILTER_VALIDATE_IP) ? 0 : 1);' "$ip" || {
            echo "Invalid address; expected one IPv4/IPv6 address"; exit 1;
          }
          site="$HOME/domains/canadamb.ca"
          app="$site/canadmb-app"
          # Check spelling of the private application directory before any write.
          app="$site/canadamb-app"
          current=$(readlink -e "$app/current")
          envfile="$app/shared/.env"
          cache="$current/bootstrap/cache/config.php"
          [[ "$current" == "$app/releases/"* && -s "$current/artisan" &&
             -f "$envfile" && ! -L "$envfile" && -f "$cache" &&
             ! -L "$cache" && -d "$app/shared/backups" &&
             ! -e "$app/update.pause" && ! -e "$current/storage/framework/down" ]] || {
            echo "Expected live private Laravel layout unavailable"; exit 1;
          }
          exec 8>"$app/update.lock"
          flock -n 8 || { echo "Existing update lock is active"; exit 1; }
          backup="$app/shared/backups/allowlist-$run_id"
          [[ ! -e "$backup" ]] || exit 1
          install -d -m 700 "$backup"
          cp -p -- "$envfile" "$backup/original.env"
          cp -p -- "$cache" "$backup/original-config.php"
          chmod 600 "$backup/original.env" "$backup/original-config.php"
          state=original
          rollback() {
            result=$?
            if (( result != 0 )) && [[ "$state" == modified ]]; then
              cp -p "$backup/original.env" "$envfile" || true
              cp -p "$backup/original-config.php" "$cache" || true
              echo "Verification failed; previous env and Laravel config restored if possible" >&2
            fi
          }
          trap rollback EXIT

          helper="$backup/append-ip.php"
          cat > "$helper" <<'PHP'
          <?php
          declare(strict_types=1);
          $path = $argv[1];
          $ip = $argv[2];
          $data = file_get_contents($path);
          if (! is_string($data) || $data === '') {
              throw new RuntimeException('Missing private environment data');
          }
          $lines = preg_split('/(?<=\n)/', $data);
          $hits = 0;
          foreach ($lines as &$line) {
              $ending = str_ends_with($line, "\r\n") ? "\r\n" : (str_ends_with($line, "\n") ? "\n" : '');
              $body = $ending === '' ? $line : substr($line, 0, -strlen($ending));
              if (! preg_match('/^([ \t]*CANADAMB_PRELAUNCH_IPS[ \t]*=[ \t]*)(.*)$/D', $body, $matches)) {
                  continue;
              }
              $hits++;
              $value = trim($matches[2]);
              $quote = '';
              if (strlen($value) >= 2 && in_array($value[0], ['"', chr(39)], true)) {
                  $quote = $value[0];
                  if (! str_ends_with($value, $quote)) {
                      throw new RuntimeException('Unexpected quoting');
                  }
                  $value = substr($value, 1, -1);
              } elseif (strpbrk($value, " \t#\"'") !== false) {
                  throw new RuntimeException('Unsupported unquoted syntax');
              }
              $old = array_values(array_filter(array_map('trim', explode(',', $value)), fn ($v) => $v !== ''));
              if ($old === []) {
                  throw new RuntimeException('Refusing to replace empty existing allowlist');
              }
              foreach ($old as $v) {
                  if (! preg_match('/^[A-Za-z0-9:._\/-]+$/D', $v)) {
                      throw new RuntimeException('Unsupported existing allowlist entry');
                  }
              }
              if (! in_array($ip, $old, true)) {
                  $old[] = $ip;
                  $line = $matches[1].$quote.implode(',', $old).$quote.$ending;
              }
          }
          unset($line);
          if ($hits !== 1) {
              throw new RuntimeException('Expected exactly one existing prelaunch allowlist');
          }
          $temp = $path.'.next-'.bin2hex(random_bytes(5));
          $updated = implode('', $lines);
          if (file_put_contents($temp, $updated, LOCK_EX) !== strlen($updated)) {
              throw new RuntimeException('Could not write complete new environment');
          }
          chmod($temp, fileperms($path) & 0777);
          if (! rename($temp, $path)) {
              throw new RuntimeException('Could not atomically install updated environment');
          }
          echo "Private .env allowlist safely updated (no existing entries removed).\n";
          PHP

          "$php" -l "$helper" >/dev/null
          state=modified
          "$php" "$helper" "$envfile" "$ip"
          "$php" "$current/artisan" config:cache >/dev/null
          "$php" -r '
              $before = require $argv[1];
              $after = require $argv[2];
              $target = $argv[3];
              $previous = $before["network"]["prelaunch_ips"] ?? [];
              $current = $after["network"]["prelaunch_ips"] ?? [];
              if (($before["network"]["prelaunch"] ?? null) !== true ||
                  ($after["network"]["prelaunch"] ?? null) !== true ||
                  ! is_array($previous) || ! is_array($current) ||
                  ! in_array($target, $current, true) ||
                  array_diff($previous, $current) !== [] ||
                  ($before["app"]["key"] ?? null) !== ($after["app"]["key"] ?? null) ||
                  ($before["database"]["connections"]["mariadb"]["database"] ?? null) !==
                      ($after["database"]["connections"]["mariadb"]["database"] ?? null)) {
                  fwrite(STDERR, "Cached Laravel configuration verification failed\n");
                  exit(1);
              }
              echo "New IP confirmed, original IPs preserved, APP_KEY and database preserved.\n";
          ' "$backup/original-config.php" "$cache" "$ip"
          "$php" -r '
              require $argv[1]."/vendor/autoload.php";
              $app = require $argv[1]."/bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $request = Illuminate\Http\Request::create("https://canadamb.ca/", "GET", [], [], [], ["REMOTE_ADDR" => $argv[2]]);
              $guard = new App\Http\Middleware\RestrictPrelaunch();
              $reply = $guard->handle($request, static fn () => response("ok"));
              if ($reply->getStatusCode() !== 200) {
                  fwrite(STDERR, "Prelaunch middleware still rejects newly approved IP\n");
                  exit(1);
              }
              echo "Prelaunch middleware access test passed.\n";
          ' "$current" "$ip"
          state=complete
          echo "CANADAMB ALLOWLIST CHANGE SUCCESS"
          echo "Active release: ${current##*/}"
          echo "No database, site content, or public_html files changed"
          REMOTE
      - name: Check both sites still deny an unapproved GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          for host in canadamb.ca brandonmb.ca; do
            code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://$host/")
            [[ "$code" == 403 ]] || { echo "::error::Unexpected $host access status ($code)"; exit 1; }
            echo "$host: HTTP 403 to unapproved runner; access gate still active."
          done
