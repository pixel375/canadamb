name: CanadaMB two-release retention

# Trusted main; cleanup runs only after live deployment audits or explicit manual dispatch.
on:
  workflow_call:
    inputs:
      reclaim:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      reclaim:
        description: 'Remove verified inactive releases and historical backup sets (otherwise inventory only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: canadamb-release-retention
  cancel-in-progress: false

jobs:
  retention:
    if: >-
      github.repository == 'pixel375/canadamb' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hostinger-prelaunch
    env:
      SSH_HOST: ${{ vars.HOSTINGER_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_PORT }}
      SSH_USER: ${{ vars.HOSTINGER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
      RECLAIM: ${{ inputs.reclaim }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inventory and retain two complete releases and backup sets
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ && "$SSH_USER" =~ ^[A-Za-z0-9_-]+$ &&
             "$SSH_PORT" =~ ^[0-9]{1,5}$ && ( "$RECLAIM" == true || "$RECLAIM" == false ) ]] || exit 1
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || exit 1
          bash -n ops/hostinger-release-retention.sh
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf -- "$dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$dir/known_hosts"
          chmod 600 "$dir/key" "$dir/known_hosts"
          ssh-keygen -y -P '' -f "$dir/key" >/dev/null
          ssh -T -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$dir/known_hosts" -o IdentitiesOnly=yes \
            -i "$dir/key" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -se -- "$RECLAIM" < ops/hostinger-release-retention.sh
          for host in canadamb.ca brandonmb.ca; do
            code=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://$host/?retention_audit=${GITHUB_RUN_ID}")
            printf '%s prelaunch access HTTP %s\n' "$host" "$code"
            [[ "$code" == 403 ]] || exit 1
          done
